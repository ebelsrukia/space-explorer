<!DOCTYPE html>
<html>

<head>
    <title>Space Survey | Space Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="top"></body>

    <header>
        <h1>Space Explorer Survey ✦</h1>
        <p>Tell us about your interest in space!</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="planets.html">Planets</a>
        <a href="solar-system.html">Solar System</a>
        <a href="gallery.html">Gallery</a>
        <a href="survey.html">Survey</a>
    </nav>

    <main>

        <section>
            <h2>What's Your Space Preference? </h2>

            <form>

                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">

                <br><br>

                <label for="object">Favorite Space Object:</label>

<select id="object" name="object">
    <option value="moon">Moon</option>
    <option value="sun">Sun</option>
    <option value="planet">Planet</option>
    <option value="star">Star</option>
    <option value="galaxy">Galaxy</option>
    <option value="comet">Comet</option>
</select>

<br><br>

                <label for="planet">Favorite Planet:</label>

                <select id="planet" name="planet">
                    <option value="mercury">Mercury</option>
                    <option value="venus">Venus</option>
                    <option value="earth">Earth</option>
                    <option value="mars">Mars</option>
                    <option value="jupiter">Jupiter</option>
                    <option value="saturn">Saturn</option>
                    <option value="uranus">Uranus</option>
                    <option value="neptune">Neptune</option>
                </select>

                <br><br>

                <label>Which space topic interests you most?</label>

                <br>

                <input type="radio" id="planets" name="topic" value="planets">
                <label for="planets">Planets</label>

                <br>

                <input type="radio" id="stars" name="topic" value="stars">
                <label for="stars">Stars</label>

                <br>

                <input type="radio" id="galaxies" name="topic" value="galaxies">
                <label for="galaxies">Galaxies</label>

                <br>

                <input type="radio" id="space-exploration" name="topic" value="space-exploration">
                <label for="space-exploration">Space Exploration</label>

                <br><br>

                <label for="rating">Rate this website:</label>

                <select id="rating" name="rating">
                    <option value="5">✧✧✧✧✧ Excellent</option>
                    <option value="4">✧✧✧✧ Very Good</option>
                    <option value="3">✧✧✧ Good</option>
                    <option value="2">✧✧ Needs Improvement</option>
                    <option value="1">✧ Poor</option>
                </select>

                <br><br>

                <label for="comments">Any comments?</label>

                <br>

                <textarea id="comments" name="comments" rows="5"
                    placeholder="Write your thoughts here..."></textarea>

                <br><br>

                <button type="submit">Submit Survey ✦</button>

            </form>

        </section>

    </main>
<div class="back-to-top">
    <a href="#top">↑ Back to Top</a>
</div>
    <footer>
        <p>✦ Space Explorer © 2026 ✦</p>
    </footer>

</body>

</html>
